<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#050308;color:#f3efff}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ReviewsGO NFC + QR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Presentación interactiva: cómo funcionan los carteles inteligentes NFC + QR de ReviewsGO.">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: escenario 3D a pantalla completa; capa HUD encima (barra superior, titular abajo-izquierda,
   panel técnico a la derecha, dock de control centrado abajo). Tema único oscuro, deliberado. */
:root {
  --void: #050308;
  --ink: #0e0a17;
  --glass: rgba(20, 14, 34, 0.56);
  --glass-hi: rgba(42, 28, 70, 0.72);
  --line: rgba(196, 170, 255, 0.14);
  --line-hi: rgba(196, 170, 255, 0.36);
  --violet: #8b5cf6;
  --lilac: #c4b5fd;
  --plasma: #d946ef;
  --fg: #f3efff;
  --muted: #a69dc2;
  --dim: #6c6488;
  --ok: #a7f3d0;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--fg); font-family: var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#root { position: fixed; inset: 0; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); }
svg { width: 18px; height: 18px; flex: none; }

.app { position: absolute; inset: 0; overflow: hidden; }
.stage { position: absolute; inset: 0; }
.stage canvas { display: block; }

/* atmósfera: viñeta + líneas de escaneo muy sutiles */
.atmos { position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(3, 1, 6, 0.78) 100%),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 3px);
  mix-blend-mode: normal; }
.sweep { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; margin-left: -1px; opacity: 0; pointer-events: none;
  background: linear-gradient(180deg, transparent, #efe6ff 22%, #fff 50%, #efe6ff 78%, transparent);
  box-shadow: 0 0 14px 3px rgba(167, 139, 250, 0.9), 0 0 60px 18px rgba(139, 92, 246, 0.45), 0 0 140px 50px rgba(217, 70, 239, 0.18); }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(60% 60% at 50% 50%, rgba(214, 196, 255, 0.85), rgba(139, 92, 246, 0.35) 45%, transparent 75%);
  mix-blend-mode: screen; }
.loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }

/* ── marca ── */
.wordmark { font-family: var(--display); font-weight: 600; letter-spacing: -0.02em; color: var(--fg); }
.wordmark b { font-weight: 800; background: linear-gradient(100deg, #b794ff, #d946ef); -webkit-background-clip: text; background-clip: text; color: transparent; }
.wordmark.xl { display: block; font-size: clamp(44px, 9vw, 112px); line-height: 1; letter-spacing: -0.04em; }

/* ── barra superior ── */
.topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) var(--gutter-r) 0 var(--gutter-l); pointer-events: none; }
.brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.brand .wordmark { font-size: 17px; }
.brand-sub { font-size: 12px; color: var(--muted); letter-spacing: .02em; white-space: nowrap; }
.meta { display: flex; align-items: center; gap: 14px; margin-right: 108px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.meta .tc { color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: .06em; }
.rec { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.rec[data-on="1"] { background: var(--plasma); box-shadow: 0 0 10px var(--plasma); animation: blink 1.6s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* ── paneles de vidrio ── */
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: 16px;
  -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%);
  box-shadow: 0 24px 70px -28px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06); }

/* ── titular ── */
.headline { position: absolute; z-index: 4; left: max(32px, env(safe-area-inset-left, 0px)); bottom: calc(132px + env(safe-area-inset-bottom, 0px));
  width: min(520px, 40vw); pointer-events: none; }
.headline::before { content: ""; position: absolute; left: -60px; right: -80px; top: -50px; bottom: -40px; z-index: -1; pointer-events: none;
  background: radial-gradient(closest-side, rgba(5, 3, 8, .72), rgba(5, 3, 8, .4) 55%, transparent); }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--lilac); display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.eyebrow::before { content: ""; width: 22px; height: 1px; background: linear-gradient(90deg, var(--lilac), transparent); }
.eyebrow.center { justify-content: center; }
.eyebrow.center::after { content: ""; width: 22px; height: 1px; background: linear-gradient(270deg, var(--lilac), transparent); }
.title { margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(26px, 2.9vw, 46px); line-height: 1.06; letter-spacing: -0.035em; text-wrap: balance;
  background: linear-gradient(180deg, #ffffff 30%, #cdbcff); -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 40px rgba(139, 92, 246, 0.15); }
.sub { margin: 16px 0 0; font-size: 16px; line-height: 1.5; color: var(--muted); max-width: 46ch; }

/* ── panel lateral ── */
.side-wrap { position: absolute; z-index: 4; right: max(28px, env(safe-area-inset-right, 0px)); top: 50%; margin-top: -40px; transform: translateY(-50%); }
.side { width: 290px; padding: 18px 18px 14px; }
.side-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: .04em; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.side-head .mono { font-size: 10px; color: var(--dim); letter-spacing: .14em; font-weight: 400; }
.specs { list-style: none; margin: 0; padding: 0; display: grid; }
.specs li { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px dashed rgba(196, 170, 255, 0.1); transition: color .5s, opacity .5s; opacity: .55; }
.specs li:last-child { border-bottom: 0; }
.specs .k { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); padding-top: 3px; }
.specs .v { font-size: 14px; line-height: 1.35; }
.specs li.seen { opacity: .85; }
.specs li.on { opacity: 1; }
.specs li.on .k { color: var(--lilac); }
.specs li.on .v { color: #fff; text-shadow: 0 0 18px rgba(167, 139, 250, .6); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 10px 0; opacity: .45; transition: opacity .5s; }
.steps li.on, .steps li.done { opacity: 1; }
.steps .num { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-hi); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.steps li.on .num { background: linear-gradient(135deg, var(--violet), var(--plasma)); border-color: transparent; color: #fff; box-shadow: 0 0 18px rgba(139, 92, 246, .7); }
.steps li.done .num { color: var(--lilac); border-color: rgba(196, 181, 253, .5); }
.steps b { display: block; font-size: 14px; font-weight: 600; }
.steps span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.steps i { display: block; height: 2px; margin-top: 8px; background: linear-gradient(90deg, var(--violet), var(--plasma)); transform-origin: 0 50%; transform: scaleX(0); border-radius: 2px; transition: transform .12s linear; }

/* ── llamadas ancladas al 3D ── */
.callouts { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.callout { position: absolute; left: 0; top: 0; visibility: hidden; will-change: transform; }
.callout-in { position: absolute; left: 0; top: 0; }
.callout .dot { position: absolute; width: 11px; height: 11px; left: -5.5px; top: -5.5px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 4px rgba(139, 92, 246, .35), 0 0 22px 4px rgba(167, 139, 250, .9); }
.callout .dot::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 1px solid rgba(196, 181, 253, .6); animation: ping 1.8s var(--ease) infinite; }
@keyframes ping { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.callout .leader { position: absolute; left: 0; top: 0; width: 62px; height: 1px; background: linear-gradient(90deg, rgba(196, 181, 253, .9), rgba(196, 181, 253, .4)); transform-origin: 0 0; transform: rotate(-38deg); }
.callout .label { position: absolute; left: 48px; top: -72px; white-space: nowrap; padding: 9px 13px 10px; border-radius: 12px; background: var(--glass-hi); border: 1px solid var(--line-hi);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 12px 40px -12px rgba(0, 0, 0, .7); }
.callout .label b { display: block; font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: -0.02em; }
.callout .label span { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--lilac); margin-top: 3px; }
.callout.left .leader { transform: rotate(-142deg); }
.callout.left .label { left: auto; right: 48px; }

/* ── intro ── */
.intro-tag { position: absolute; z-index: 3; left: 0; right: 0; top: 64%; text-align: center; font-size: 12px; color: var(--lilac); text-transform: uppercase; letter-spacing: .32em; pointer-events: none; }

/* ── fotos reales ── */
.photos { position: absolute; z-index: 4; right: max(28px, env(safe-area-inset-right, 0px)); top: calc(70px + env(safe-area-inset-top, 0px)); pointer-events: none; }
.photos-label { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--lilac); margin-bottom: 10px; text-align: right; }
.photos-row { display: flex; gap: 12px; }
.photos figure { margin: 0; width: 118px; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--line-hi); box-shadow: 0 18px 40px -16px rgba(0, 0, 0, .9); background: #ddd; }
.photos img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* ── flujo final ── */
.flow { position: absolute; z-index: 4; left: 50%; top: 46%; transform: translate(-50%, -50%); width: min(1040px, calc(100% - 48px)); }
.flow::before { content: ""; position: absolute; left: -12%; right: -12%; top: -70%; bottom: -70%; z-index: -1; background: radial-gradient(closest-side, rgba(5, 3, 8, .82), rgba(5, 3, 8, .55) 60%, transparent); pointer-events: none; }
.flow-row { display: flex; align-items: flex-start; justify-content: center; }
.node { flex: 0 1 190px; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; opacity: .25; transform: translateY(14px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
.node.on { opacity: 1; transform: none; }
.node-icon { width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; margin-bottom: 10px; color: #fff;
  background: linear-gradient(160deg, rgba(139, 92, 246, .35), rgba(20, 14, 34, .7)); border: 1px solid var(--line-hi);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .03) inset, 0 20px 50px -20px rgba(139, 92, 246, .8); }
.node.on .node-icon { box-shadow: 0 0 0 1px rgba(255, 255, 255, .06) inset, 0 0 40px rgba(139, 92, 246, .55); }
.node-icon svg { width: 32px; height: 32px; }
.node b { font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .02em; text-transform: uppercase; }
.node span { font-size: 13px; color: var(--muted); }
.conn { flex: 1 1 60px; height: 2px; margin-top: 38px; background: rgba(196, 170, 255, .12); position: relative; overflow: hidden; border-radius: 2px; }
.conn span { position: absolute; inset: 0; background: linear-gradient(90deg, var(--violet), var(--plasma)); transform: scaleX(0); transform-origin: 0 50%; transition: transform .9s var(--ease); }
.conn.on span { transform: scaleX(1); }
.conn.on::after { content: ""; position: absolute; top: -3px; width: 40px; height: 8px; border-radius: 8px; background: radial-gradient(closest-side, #fff, rgba(196, 181, 253, 0)); animation: travel 1.6s linear infinite; }
@keyframes travel { from { left: -40px; } to { left: 100%; } }

.final::before { content: ""; position: absolute; left: -10%; right: -10%; top: -40%; bottom: -40%; z-index: -1; background: radial-gradient(closest-side, rgba(5, 3, 8, .7), transparent); pointer-events: none; }
.final { position: absolute; z-index: 4; left: 50%; top: 61%; transform: translateX(-50%); width: min(760px, calc(100% - 32px)); text-align: center; }
.final h2 { margin: 0 0 22px; font-family: var(--display); font-weight: 500; font-size: clamp(22px, 2.9vw, 40px); letter-spacing: -0.03em; line-height: 1.12; text-wrap: balance; }
.contact { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.contact a, .contact > span { display: inline-flex; align-items: center; gap: 9px; padding: 10px 16px; border-radius: 999px; color: var(--fg); text-decoration: none; font-family: var(--mono); font-size: 13px;
  background: rgba(139, 92, 246, .12); border: 1px solid var(--line-hi); transition: background .3s, border-color .3s; }
.contact a:hover { background: rgba(139, 92, 246, .3); border-color: var(--lilac); }
.contact a:focus-visible, .btn:focus-visible, .ib:focus-visible, .chip:focus-visible, .seg:focus-visible { outline: 2px solid var(--lilac); outline-offset: 3px; }
.replay { margin-top: 18px; }

/* ── botones ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 0; cursor: pointer; border-radius: 999px; padding: 14px 24px; font-weight: 600; font-size: 15px; letter-spacing: .01em; transition: transform .3s var(--ease), box-shadow .3s, background .3s; }
.btn.primary { color: #fff; background: linear-gradient(110deg, #7c3aed, #a855f7 55%, #d946ef); box-shadow: 0 10px 40px -8px rgba(139, 92, 246, .8), inset 0 1px 0 rgba(255, 255, 255, .3); }
.btn.primary:hover { transform: translateY(-2px); box-shadow: 0 16px 50px -8px rgba(168, 85, 247, .95), inset 0 1px 0 rgba(255, 255, 255, .3); }
.btn.ghost { background: rgba(255, 255, 255, .04); border: 1px solid var(--line-hi); color: var(--fg); padding: 11px 18px; font-size: 14px; }
.btn.ghost:hover { background: rgba(139, 92, 246, .18); }

/* ── pantalla de inicio ── */
.start { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; padding: 24px var(--gutter-r) 24px var(--gutter-l);
  background: radial-gradient(70% 60% at 50% 50%, rgba(5, 3, 8, .25), rgba(5, 3, 8, .82)); }
.start-card { text-align: center; max-width: 640px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.lede { margin: 4px 0 8px; font-size: 17px; line-height: 1.55; color: var(--muted); max-width: 44ch; text-wrap: balance; }
.start-alt { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.keys { font-size: 11px; color: var(--dim); letter-spacing: .08em; margin-top: 6px; }

/* ── dock ── */
.dock { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: min(1060px, calc(100% - 32px)); display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 20px; }
.ctrls, .demos { display: flex; align-items: center; gap: 6px; flex: none; }
.ib { width: 40px; height: 40px; border-radius: 12px; border: 1px solid transparent; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--fg); transition: background .25s, border-color .25s; }
.ib:hover { background: rgba(255, 255, 255, .06); border-color: var(--line); }
.ib.play { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #d946ef); box-shadow: 0 6px 24px -6px rgba(139, 92, 246, .9); }
.ib.play:hover { background: linear-gradient(135deg, #8b5cf6, #e879f9); }
.ib.small { width: 36px; height: 36px; color: var(--muted); }
.segs { flex: 1 1 auto; min-width: 0; display: flex; gap: 6px; }
.seg { flex: 1 1 0; min-width: 0; background: none; border: 0; padding: 6px 2px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 7px; border-radius: 8px; }
.seg .bar { position: relative; display: block; height: 3px; border-radius: 3px; background: rgba(196, 170, 255, .14); overflow: hidden; }
.seg .fill { position: absolute; inset: 0; background: linear-gradient(90deg, var(--violet), var(--plasma)); transform-origin: 0 50%; transform: scaleX(0); }
.seg.done .fill { background: rgba(196, 181, 253, .55); }
.seg .lbl { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .3s; }
.seg .lbl em { font-style: normal; font-family: var(--mono); font-size: 10px; margin-right: 6px; color: inherit; opacity: .7; }
.seg.on .lbl { color: var(--fg); }
.seg:hover .lbl { color: var(--lilac); }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-hi); background: rgba(255, 255, 255, .03); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .25s, border-color .25s; }
.chip:hover { background: rgba(139, 92, 246, .16); }
.chip.on { background: rgba(139, 92, 246, .26); border-color: var(--lilac); }

/* sonido */
.sound { position: relative; }
.sound .eq { position: absolute; right: 3px; bottom: 5px; display: none; gap: 1.5px; align-items: flex-end; height: 9px; }
.sound.live .eq { display: flex; }
.sound .eq i { width: 2px; height: 3px; border-radius: 1px; background: var(--lilac); animation: eq 0.9s ease-in-out infinite; }
.sound .eq i:nth-child(2) { animation-delay: -.3s; }
.sound .eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 9px; } }
.sound.on { color: var(--fg); }
.sound-note { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; cursor: pointer; color: var(--dim); font-size: 13px; padding: 6px 10px; border-radius: 999px; transition: color .3s, background .3s; }
.sound-note.on { color: var(--lilac); }
.sound-note:hover { background: rgba(139, 92, 246, .12); }
.sound-note:focus-visible { outline: 2px solid var(--lilac); outline-offset: 3px; }

/* animaciones CSS en pausa cuando la presentación está pausada */
.paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }

/* ── modo sin WebGL ── */
.fallback { position: absolute; inset: 0; display: grid; place-items: center; perspective: 1400px; }
.fb-card { width: min(34vh, 60vw); aspect-ratio: 2 / 3; max-width: 100%; transform-style: preserve-3d; border-radius: 4px; box-shadow: 0 40px 120px -30px rgba(139, 92, 246, .7), 0 0 0 6px #f1eff4; }
.fb-card img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 3px; }

/* ── responsive ── */
@media (max-width: 1100px) {
  .side { width: 250px; }
  .brand-sub { display: none; }
}
@media (max-width: 860px) {
  .side-wrap, .photos { display: none; }
  .headline { width: auto; right: var(--gutter-r); left: var(--gutter-l); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
  .title { font-size: clamp(22px, 6vw, 34px); }
  .sub { font-size: 14px; margin-top: 10px; }
  .dock { flex-wrap: wrap; gap: 8px 10px; padding: 10px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .segs { order: -1; flex-basis: 100%; }
  .seg .lbl em { margin-right: 0; }
  .seg .lbl { font-size: 10px; }
  .demos { margin-left: auto; }
  .flow-row { flex-direction: column; align-items: stretch; gap: 0; }
  .node { flex-direction: row; text-align: left; flex: none; gap: 14px; transform: translateX(-10px); }
  .node.on { transform: none; }
  .node-icon { width: 52px; height: 52px; border-radius: 16px; margin: 0; flex: none; }
  .node-icon svg { width: 24px; height: 24px; }
  .node > b { font-size: 14px; }
  .node { display: grid; grid-template-columns: 52px 1fr; grid-template-rows: auto auto; column-gap: 14px; row-gap: 2px; align-items: center; }
  .node-icon { grid-row: 1 / 3; }
  .node > b { align-self: end; }
  .node > span { align-self: start; }
  .conn { width: 2px; height: 22px; flex: none; margin: 4px 0 4px 25px; }
  .conn span { transform: scaleY(0); transform-origin: 50% 0; }
  .conn.on span { transform: scaleY(1); }

    const ig = g.createLinearGradient(70, 0, 130, 0); ig.addColorStop(0, '#7c3aed'); ig.addColorStop(1, '#c026d3');
    g.fillStyle = ig; g.beginPath(); g.arc(104, H - 218, 30, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 4.5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(94, H - 208); g.lineTo(114, H - 228); g.stroke();
    g.beginPath(); g.moveTo(100, H - 229); g.lineTo(115, H - 229); g.lineTo(115, H - 214); g.stroke();
    g.fillStyle = '#1b1526'; g.font = `700 26px ${SF}`; g.textAlign = 'left';
    g.fillText('Abrir enlace del comercio', 152, H - 226);
    g.fillStyle = '#6b6480'; g.font = `400 21px ${SF}`;
    g.fillText('Página de reseñas', 152, H - 194);
  } else {
    g.strokeStyle = '#fff'; g.lineWidth = 6; g.beginPath(); g.arc(W / 2, H - 150, 46, 0, Math.PI * 2); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(W / 2, H - 150, 36, 0, Math.PI * 2); g.fill();
  }
  homeBar(g, W, H, 'rgba(255,255,255,0.7)');
}

function drawScreen(g, st, clock, img) {
  const W = SCREEN_W, H = SCREEN_H;
  g.save();
  const m = st.mode;
  let statusColor = '#ffffff';
  if (m === 'reviews') drawReviews(g, W, H, st.p, clock);
  else if (m === 'opening') { drawOpening(g, W, H, st.p, clock); statusColor = '#1b1526'; }
  else if (m === 'camera') drawCamera(g, W, H, st, clock, img);
  else {
    drawLock(g, W, H, clock, m === 'lock');
    if (m === 'nfcSearch') drawSheet(g, W, H, 'search', st.p, clock);
    if (m === 'nfcDetected') drawSheet(g, W, H, 'ok', st.p, clock);
  }
  drawStatus(g, W, statusColor);
  g.restore();
}

/* ───────────────────────── Mundo 3D (Three.js r128) ─────────────────────────
   Unidades: centímetros. Piso en y = 0. El cartel mira hacia +z.            */

/* Zonas calibradas sobre la foto del cartel (cm, origen en el centro del cartel).

const SIGN = { w: 10, h: 15, d: 0.3, lean: 25 };          // 10 × 15 cm, PVC 3 mm, inclinado 25° sobre el soporte
const ZONES = {

function createWorld(container, signImg) {
  const T = THREE;
  const D2R = Math.PI / 180;
  const V = (x = 0, y = 0, z = 0) => new T.Vector3(x, y, z);

  const renderer = new T.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });

  };
  panel(34, 22, 0xffffff, 2.4, [14, 28, 34]);
  panel(8, 70, 0x8b5cf6, 3.2, [-40, 6, -8]);
  panel(8, 70, 0xc026d3, 2.2, [40, 0, -18]);
  panel(70, 5, 0xffffff, 0.7, [0, -22, 34]);

  /* ── luces ── */
  scene.add(new T.AmbientLight(0x6b5a8e, 0.38));

  const rim2 = new T.DirectionalLight(0xd946ef, 1.3); rim2.position.set(26, 8, -20); scene.add(rim2);
  const fxLight = new T.PointLight(0xa78bfa, 0, 45, 2); scene.add(fxLight);

  /* ── utilidades de textura ── */
  const canvasTex = (w, h, draw) => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);

  };
  const radial = (stops) => canvasTex(128, 128, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    stops.forEach(([o, c]) => gr.addColorStop(o, c)); g.fillStyle = gr; g.fillRect(0, 0, w, w);
  });
  const sprite = radial([[0, 'rgba(255,255,255,1)'], [0.22, 'rgba(255,255,255,0.75)'], [0.5, 'rgba(255,255,255,0.18)'], [1, 'rgba(255,255,255,0)']]);
  const glowTex = radial([[0, 'rgba(160,110,255,0.9)'], [0.35, 'rgba(120,70,230,0.35)'], [1, 'rgba(0,0,0,0)']]);
  const additive = (opts) => new T.MeshBasicMaterial(Object.assign({ transparent: true, depthWrite: false, blending: T.AdditiveBlending, toneMapped: false, side: T.DoubleSide }, opts));

  /* ── piso holográfico ── */
  const floorTex = canvasTex(512, 512, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, '#1a1030'); gr.addColorStop(0.18, '#0d0818'); gr.addColorStop(0.5, '#060409'); gr.addColorStop(1, '#050308');
    g.fillStyle = gr; g.fillRect(0, 0, w, w);

  const clipPlane = new T.Plane(V(-1, 0, 0), 1000);

  });
  const plateGroup = new T.Group(); plateGroup.position.set(0, 0.66, -2.12); plateGroup.rotation.x = -50 * D2R; stand.add(plateGroup);
  const plate = new T.Mesh(new T.BoxGeometry(5.3, 0.42, 6.8), white); plate.position.set(0, 0, 3.4); plateGroup.add(plate);
  const hingeC = new T.Mesh(new T.CylinderGeometry(0.34, 0.34, 2.2, 24), white); hingeC.rotation.z = Math.PI / 2; plateGroup.add(hingeC);

  // Cartel PVC 10 × 15 × 0,3 cm con la foto real en el frente
  const signGroup = new T.Group(); signGroup.position.set(0, 0.5, 4.74); signGroup.rotation.x = -SIGN.lean * D2R; product.add(signGroup);
  const signTex = new T.Texture(signImg);
  signTex.encoding = T.sRGBEncoding; signTex.anisotropy = renderer.capabilities.getMaxAnisotropy(); signTex.needsUpdate = true;
  const edgeMat = clipped(new T.MeshStandardMaterial({ color: 0xf1eff4, roughness: 0.6 }));

  const sign = new T.Mesh(new T.BoxGeometry(SIGN.w, SIGN.h, SIGN.d), [edgeMat, edgeMat, edgeMat, edgeMat, frontMat, backMat]);
  sign.position.set(0, SIGN.h / 2, SIGN.d / 2); signGroup.add(sign);

    g.fillStyle = '#f2f0f6'; g.beginPath(); g.arc(w / 2, w / 2, w / 2, 0, Math.PI * 2); g.fill();

  tagTex.encoding = T.sRGBEncoding;
  const tagMat = clipped(new T.MeshStandardMaterial({ map: tagTex, roughness: 0.32, metalness: 0.35, side: T.DoubleSide, emissive: new T.Color(0x7c3aed), emissiveIntensity: 0 }));
  const tag = new T.Mesh(new T.CircleGeometry(TAG_R, 64), tagMat);

  const lamMat = clipped(new T.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, roughness: 0.06, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.04, side: T.DoubleSide, depthWrite: false }));
  const laminate = new T.Mesh(new T.PlaneGeometry(SIGN.w - 0.04, SIGN.h - 0.04), lamMat);
  laminate.position.z = -SIGN.d / 2 - 0.03; laminate.rotation.y = Math.PI; sign.add(laminate);

  const nfcRing = new T.Mesh(new T.RingGeometry(1.62, 1.72, 96), additive({ color: 0xc4b5fd, opacity: 0 }));
  nfcRing.position.copy(nfcGlow.position); sign.add(nfcRing);
  const waves = [];
  for (let i = 0; i < 4; i++) {

    w.position.set(ZONES.nfc.x, ZONES.nfc.y, FZ + 0.01 + i * 0.002); sign.add(w); waves.push(w);
  }
  // marco de escaneo del QR
  const qrFrame = new T.Group(); qrFrame.position.set(ZONES.qr.x, ZONES.qr.y, FZ); sign.add(qrFrame);
  const qrMat = additive({ color: 0xc4b5fd, opacity: 0 });
  const corners = [];
  [[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(([sx, sy]) => {

    const a = new T.Mesh(new T.PlaneGeometry(0.75, 0.09), qrMat); a.position.set(-sx * 0.33, 0, 0);

  scanBar.position.set(ZONES.qr.x, ZONES.qr.y, FZ + 0.01); sign.add(scanBar);
  const scanLine = new T.Mesh(new T.PlaneGeometry(ZONES.qr.w + 0.5, 0.05), additive({ color: 0xf1eaff, opacity: 0 }));
  scanBar.add(scanLine);

  // cotas 10 cm / 15 cm
  const dimMat = new T.LineBasicMaterial({ color: 0xc4b5fd, transparent: true, opacity: 0, depthWrite: false });
  const hw = SIGN.w / 2, hh = SIGN.h / 2, dy = hh + 0.9, dx = -hw - 0.9;
  const dimPts = [

  const PW = 7.1, PH = 14.6, PD = 0.8;
  const phone = new T.Group(); scene.add(phone);
  const bodyGeo = new T.ExtrudeGeometry(rrShape(new T.Shape(), -PW / 2, -PH / 2, PW / 2, PH / 2, 1.15), { depth: PD - 0.12, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 4, curveSegments: 24 });
  bodyGeo.center();
  phone.add(new T.Mesh(bodyGeo, new T.MeshStandardMaterial({ color: 0x1d1827, metalness: 0.9, roughness: 0.26 })));
  const glassGeo = new T.ShapeGeometry(rrShape(new T.Shape(), -PW / 2 + 0.05, -PH / 2 + 0.05, PW / 2 - 0.05, PH / 2 - 0.05, 1.1), 24);
  const glass = new T.Mesh(glassGeo, new T.MeshStandardMaterial({ color: 0x050507, metalness: 0.2, roughness: 0.06 }));
  glass.position.z = PD / 2 + 0.003; phone.add(glass);
  const SW = 6.7, SH = 14.1;
  const screenGeo = new T.ShapeGeometry(rrShape(new T.Shape(), -SW / 2, -SH / 2, SW / 2, SH / 2, 0.95), 24);
  const uv = screenGeo.attributes.uv, sp = screenGeo.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (sp.getX(i) + SW / 2) / SW, (sp.getY(i) + SH / 2) / SH);
  uv.needsUpdate = true;
  const screenCanvas = document.createElement('canvas'); screenCanvas.width = SCREEN_W; screenCanvas.height = SCREEN_H;
  const sctx = screenCanvas.getContext('2d');
  const screenTex = new T.CanvasTexture(screenCanvas); screenTex.encoding = T.sRGBEncoding; screenTex.anisotropy = 4;
  const screenMat = new T.MeshBasicMaterial({ map: screenTex, toneMapped: false });
  const screen = new T.Mesh(screenGeo, screenMat); screen.position.z = PD / 2 + 0.006; phone.add(screen);
  const bumpGeo = new T.ExtrudeGeometry(rrShape(new T.Shape(), -1.3, -1.3, 1.3, 1.3, 0.55), { depth: 0.12, bevelEnabled: false, curveSegments: 12 });
  const darkMetal = new T.MeshStandardMaterial({ color: 0x2a2433, metalness: 0.85, roughness: 0.3 });
  const bump = new T.Mesh(bumpGeo, darkMetal); bump.position.set(-1.85, 5.45, -PD / 2 - 0.12); phone.add(bump);
  const lensMat = new T.MeshStandardMaterial({ color: 0x050508, metalness: 0.6, roughness: 0.08 });
  [[-2.4, 6.0], [-1.3, 4.9], [-2.4, 4.9]].forEach(([x, y]) => {
    const l = new T.Mesh(new T.CylinderGeometry(0.42, 0.42, 0.12, 32), lensMat); l.rotation.x = Math.PI / 2; l.position.set(x, y, -PD / 2 - 0.18); phone.add(l);
  });

    const b = new T.Mesh(new T.BoxGeometry(0.1, h, 0.32), darkMetal); b.position.set(x, y, 0); phone.add(b);

  // haz de conexión NFC

  const beamMat = new T.PointsMaterial({ size: 0.36, map: sprite, color: 0xd5c6ff, transparent: true, opacity: 0, depthWrite: false, blending: T.AdditiveBlending, toneMapped: false });
  const beam = new T.Points(beamGeo, beamMat); beam.frustumCulled = false; scene.add(beam);
  // frustum de la cámara del teléfono (escaneo QR)
  const frPos = new Float32Array(8 * 3);
  const frGeo = new T.BufferGeometry(); frGeo.setAttribute('position', new T.BufferAttribute(frPos, 3));
  const frMat = new T.LineBasicMaterial({ color: 0xb794ff, transparent: true, opacity: 0, depthWrite: false, blending: T.AdditiveBlending, toneMapped: false });
  const frustum = new T.LineSegments(frGeo, frMat); frustum.frustumCulled = false; scene.add(frustum);

  /* ── partículas: logo ReviewsGO ── */
  const N = 6200;
  const logo = new T.Group(); scene.add(logo);
  const pPos = new Float32Array(N * 3), pCol = new Float32Array(N * 3);
  const L = new Float32Array(N * 3), S = new Float32Array(N * 3), E = new Float32Array(N * 3), delay = new Float32Array(N), phase = new Float32Array(N);
  const pGeo = new T.BufferGeometry();
  pGeo.setAttribute('position', new T.BufferAttribute(pPos, 3)); pGeo.setAttribute('color', new T.BufferAttribute(pCol, 3));
  const pMat = new T.PointsMaterial({ size: 0.24, map: sprite, vertexColors: true, transparent: true, opacity: 0, depthWrite: false, blending: T.AdditiveBlending, toneMapped: false, sizeAttenuation: true });
  const points = new T.Points(pGeo, pMat); points.frustumCulled = false; logo.add(points);
  let logoW = 24;
  for (let i = 0; i < N; i++) {
    const r = 14 + Math.random() * 26, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    S[i * 3] = r * Math.sin(ph) * Math.cos(th); S[i * 3 + 1] = r * Math.cos(ph) * 0.6; S[i * 3 + 2] = Math.min(10, r * Math.sin(ph) * Math.sin(th));

    const g = c.getContext('2d'); const fs = 210;
    g.font = `700 ${fs}px "Unbounded", "Arial Black", sans-serif`; g.textBaseline = 'middle';
    const wa = g.measureText('Reviews').width, wb = g.measureText('GO').width, gap = fs * 0.05, tw = wa + gap + wb, x0 = (W - tw) / 2;
    g.fillStyle = '#ffffff'; g.fillText('Reviews', x0, H / 2);
    g.fillStyle = '#ff00ff'; g.fillText('GO', x0 + wa + gap, H / 2);
    const d = g.getImageData(0, 0, W, H).data; const cand = [];
    for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) { const k = (y * W + x) * 4; if (d[k + 3] > 150) cand.push(x, y, d[k + 1] < 110 ? 1 : 0); }
    const n = cand.length / 3; if (!n) return;
    const sc = 24 / tw; logoW = 24;
    for (let i = 0; i < N; i++) {
      const j = ((Math.random() * n) | 0) * 3;

        const i3 = i * 3;
        const k = easeOut(clamp((conv * 1.35 - delay[i]) / 1));
        const ang = (1 - k) * 2.4 + clock * 0.06 * (1 - k);
        const ca = Math.cos(ang), sa = Math.sin(ang);
        const sx = S[i3] * ca - S[i3 + 2] * sa, sz = S[i3] * sa + S[i3 + 2] * ca;
        const br = Math.sin(clock * 1.8 + phase[i]) * 0.035;
        let x = lerp(sx, L[i3], k) + Math.sin(clock * 0.7 + phase[i]) * (1 - k) * 0.8;
        let y = lerp(S[i3 + 1], L[i3 + 1] + br, k) + Math.cos(clock * 0.5 + phase[i]) * (1 - k) * 0.8;
        let z = lerp(sz, L[i3 + 2], k);
        if (line > -1) {
          const fx0 = 0.5 + (L[i3] / logoW) * frac;
          const d = easeIn(clamp((line - fx0) * 3.2));
          if (d > 0) { x = lerp(x, E[i3], d); y = lerp(y, E[i3 + 1], d); z = lerp(z, E[i3 + 2], d); }
        }
        pPos[i3] = x; pPos[i3 + 1] = y; pPos[i3 + 2] = z;
      }
      pGeo.attributes.position.needsUpdate = true;
    }
    dust.rotation.y = clock * 0.01; dust.position.y = Math.sin(clock * 0.2) * 0.6;

    renderer.render(scene, camera);
    return { sweepPx, sweepAlpha: st.sweepAlpha || 0, flash: st.flash || 0 };
  }

  const anchorDefs = {
    width: () => [sign, V(0, SIGN.h / 2 + 0.9, FZ)],
    height: () => [sign, V(-SIGN.w / 2 - 0.9, 0, FZ)],
    thick: () => [sign, V(4.2, SIGN.h / 2, 0)],
    qr: () => [sign, V(ZONES.qr.x + ZONES.qr.w / 2 + 0.2, ZONES.qr.y + ZONES.qr.h / 2 + 0.2, FZ)],
    nfcFront: () => [sign, V(ZONES.nfc.x - 1.3, ZONES.nfc.y + 1.4, FZ)],
    tag: () => [tag, V(-TAG_R * 0.7, TAG_R * 0.7, 0)],
    laminate: () => [laminate, V(-3.6, 5.2, 0)],
    pvc: () => [sign, V(-SIGN.w / 2, -3, 0)],
    stand: () => [plate, V(2.65, 0.21, 2.2)],
    phoneSide: () => [phone, V(-PW / 2 - 0.2, 3.5, PD / 2)],
  };
  function project(name) {
    const def = anchorDefs[name]; if (!def) return null;
    const [obj, local] = def();
    if (obj === phone && !phone.visible) return null;
    const v = obj.localToWorld(local.clone()).project(camera);
    if (v.z > 1 || v.z < -1) return null;
    return { x: (v.x + 1) / 2 * vw, y: (1 - v.y) / 2 * vh };
  }
  function setSignImage(img) {
    signImg = img; signTex.image = img; signTex.needsUpdate = true;
  }
  function dispose() { renderer.dispose(); if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement); }

  return { update, resize, project, setSignImage, dispose, rebuildLogo: buildLogo };
}

/* ───────────────────────── Diseño sonoro (Web Audio, todo sintetizado) ─────────────────────────
   Capas continuas: colchón armónico (Mi mayor 9), brillo de partículas, campo NFC, barrido del escáner.
   Ganchos: firma sonora ReviewsGO (Mi–Si–Mi–Sol#), pulso a 92 BPM, "recompensas" en cada estrella,
   éxito NFC/QR con la misma firma corta, golpes y barridos sincronizados con la cámara.          */

const NOTE = { E2: 82.41, B2: 123.47, E3: 164.81, FS3: 185.0, GS3: 207.65, B3: 246.94, E4: 329.63, GS4: 415.3, B4: 493.88, CS5: 554.37, E5: 659.25, FS5: 739.99, GS5: 830.61, B5: 987.77, CS6: 1108.73, E6: 1318.51, GS6: 1661.22 };
const SOUND_KEY = 'reviewsgo-sound';

function createAudio() {
  let ctx = null, master, bus, rev, revIn, noiseBuf;
  let layers = null;
  let enabled = true;
  try { enabled = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) { /* sin almacenamiento */ }
  let prevScene = -1, prevT = 0, lastBeat = -1, lastHalf = -1, typed = 0, lastTick = 0, lastSpark = 0, lastPing = -1;
  const subs = new Set();
  const notify = () => subs.forEach((f) => f());

  function init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC({ latencyHint: 'interactive' });
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = enabled ? 1 : 0;
    bus = ctx.createGain(); bus.gain.value = 1;
    bus.connect(comp); comp.connect(master); master.connect(ctx.destination);
    // reverberación generada (cola de ruido con caída exponencial)
    rev = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * 2.8), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    rev.buffer = ir;
    revIn = ctx.createGain(); revIn.gain.value = 0.55;
    revIn.connect(rev); rev.connect(bus);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    buildLayers();
    return true;
  }

  const now = () => ctx.currentTime + 0.012;
  const out = (node, pan = 0, wet = 0.25) => {
    let n = node;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; node.connect(p); n = p; }
    n.connect(bus);
    if (wet > 0) { const w = ctx.createGain(); w.gain.value = wet; n.connect(w); w.connect(revIn); }
    return n;
  };
  function env(g, t0, peak, a, d) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
  }
  function tone({ f, to, type = 'sine', t = 0, a = 0.005, d = 0.4, g = 0.1, pan = 0, wet = 0.25, detune = 0 }) {
    const t0 = now() + t;
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t0); o.detune.value = detune;
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + a + d);
    const gn = ctx.createGain(); env(gn, t0, g, a, d);
    o.connect(gn); out(gn, pan, wet); o.start(t0); o.stop(t0 + a + d + 0.05);
  }
  function bell(f, t = 0, g = 0.08, pan = 0, d = 1.6) {
    tone({ f, t, g, d, pan, wet: 0.5 });
    tone({ f: f * 2.01, t, g: g * 0.35, d: d * 0.5, pan, wet: 0.5 });
    tone({ f: f * 3.98, t, g: g * 0.12, d: d * 0.25, pan, wet: 0.5, type: 'triangle' });
  }
  function noise({ t = 0, dur = 0.5, g = 0.1, type = 'bandpass', f = 1000, f2, q = 1, pan = 0, pan2, a = 0.01, wet = 0.2 }) {
    const t0 = now() + t;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t0);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    const gn = ctx.createGain(); gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.linearRampToValueAtTime(g, t0 + Math.max(a, 0.005));
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(fl); fl.connect(gn);
    let n = gn;
    if (ctx.createStereoPanner && (pan || pan2 !== undefined)) {
      const p = ctx.createStereoPanner(); p.pan.setValueAtTime(pan, t0);
      if (pan2 !== undefined) p.pan.linearRampToValueAtTime(pan2, t0 + dur);
      gn.connect(p); n = p;
    }
    n.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; n.connect(w); w.connect(revIn); }
    s.start(t0, Math.random()); s.stop(t0 + dur + 0.05);
  }

  /* ── vocabulario sonoro ── */
  const S = {
    kick(g = 0.32, t = 0) { tone({ f: 140, to: 42, t, a: 0.002, d: 0.32, g, wet: 0.05 }); },
    hat(g = 0.025, t = 0) { noise({ t, dur: 0.05, g, type: 'highpass', f: 8000, q: 0.7, wet: 0.05, pan: 0.2 }); },
    blip(f = 1400, g = 0.05, t = 0, pan = 0) { tone({ f, t, a: 0.002, d: 0.07, g, pan, wet: 0.15 }); },
    tick(g = 0.03) { noise({ dur: 0.025, g, type: 'bandpass', f: 3200 + Math.random() * 800, q: 4, wet: 0.02, pan: (Math.random() - 0.5) * 0.4 }); },
    whoosh(dur = 0.9, p1 = -0.6, p2 = 0.6, g = 0.11, t = 0) { noise({ t, dur, g, type: 'bandpass', f: 280, f2: 2600, q: 1.4, pan: p1, pan2: p2, a: dur * 0.55, wet: 0.3 }); },
    riser(dur = 1.2, t = 0) {
      noise({ t, dur, g: 0.09, type: 'highpass', f: 400, f2: 7000, q: 0.8, a: dur * 0.9, wet: 0.35 });
      tone({ f: 110, to: 880, type: 'sawtooth', t, a: dur * 0.9, d: 0.12, g: 0.025, wet: 0.3 });
    },
    impact(g = 0.5, t = 0) {
      tone({ f: 90, to: 34, t, a: 0.003, d: 1.1, g, wet: 0.3 });
      noise({ t, dur: 0.9, g: g * 0.35, type: 'lowpass', f: 2400, f2: 120, q: 0.5, wet: 0.6 });
    },
    glide(up = true, t = 0) { tone({ f: up ? 300 : 900, to: up ? 900 : 300, t, a: 0.05, d: 0.5, g: 0.04, type: 'triangle', wet: 0.4 }); },
    tap() { noise({ dur: 0.04, g: 0.22, type: 'bandpass', f: 1800, q: 1.2, wet: 0.08 }); tone({ f: 240, to: 120, a: 0.001, d: 0.08, g: 0.2, wet: 0.05 }); },
    ping(g = 0.05, pan = 0) { tone({ f: 1568, a: 0.002, d: 0.35, g, pan, wet: 0.55 }); tone({ f: 1568, t: 0.16, a: 0.002, d: 0.25, g: g * 0.35, pan: -pan, wet: 0.55 }); },
    chirp(t = 0) { [NOTE.B4, NOTE.E5, NOTE.GS5].forEach((f, i) => tone({ f, t: t + i * 0.055, a: 0.003, d: 0.12, g: 0.05, type: 'triangle', wet: 0.25 })); },
    pop(t = 0) { tone({ f: 520, to: 1040, t, a: 0.004, d: 0.12, g: 0.06, wet: 0.2 }); },
    shutter() { noise({ dur: 0.03, g: 0.12, type: 'highpass', f: 2500, wet: 0.05 }); noise({ t: 0.06, dur: 0.05, g: 0.08, type: 'highpass', f: 2000, wet: 0.05 }); },
    // firma sonora ReviewsGO: Mi5 – Si5 – Mi6 – Sol#6 (con sub en Mi2)
    signature(full = true, t = 0) {
      const seq = full ? [NOTE.E5, NOTE.B5, NOTE.E6, NOTE.GS6] : [NOTE.B5, NOTE.E6];
      seq.forEach((f, i) => bell(f, t + i * 0.13, full ? 0.075 : 0.065, (i - 1.5) * 0.25, full && i === seq.length - 1 ? 2.6 : 1.4));
      if (full) { tone({ f: NOTE.E2, t, a: 0.08, d: 2.6, g: 0.16, wet: 0.4 }); tone({ f: NOTE.B2, t: t + 0.13, a: 0.1, d: 2.2, g: 0.07, wet: 0.4, type: 'triangle' }); }
    },
    star(i, t = 0) { const f = [NOTE.E5, NOTE.FS5, NOTE.GS5, NOTE.B5, NOTE.CS6][i]; bell(f, t, 0.06, (i - 2) * 0.2, 0.9); },
    success(t = 0) { [NOTE.E5, NOTE.GS5, NOTE.B5, NOTE.E6].forEach((f) => bell(f, t, 0.045, 0, 1.8)); },
    node(i) { bell([NOTE.E4, NOTE.GS4, NOTE.B4, NOTE.E5][i], 0, 0.07, (i - 1.5) * 0.35, 1.2); S.kick(0.18); },
    sparkle() { const f = [NOTE.E6, NOTE.GS6, NOTE.B5, NOTE.CS6, 1975.5][(Math.random() * 5) | 0]; tone({ f, a: 0.002, d: 0.25, g: 0.012 + Math.random() * 0.012, pan: Math.random() * 1.6 - 0.8, wet: 0.6 }); },
  };

  /* ── capas continuas ── */
  function loopNoise() { const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(); return s; }
  function buildLayers() {
    const padF = ctx.createBiquadFilter(); padF.type = 'lowpass'; padF.frequency.value = 300; padF.Q.value = 0.8;
    const padG = ctx.createGain(); padG.gain.value = 0;
    [[NOTE.E2, 'sawtooth', -6], [NOTE.B2, 'sawtooth', 5], [NOTE.FS3, 'triangle', -3], [NOTE.GS3, 'triangle', 4], [NOTE.E3, 'sine', 0]].forEach(([f, type, det]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det; const g = ctx.createGain(); g.gain.value = type === 'sawtooth' ? 0.35 : 0.5;
      o.connect(g); g.connect(padF); o.start();
    });
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07; const lfoG = ctx.createGain(); lfoG.gain.value = 140; lfo.connect(lfoG); lfoG.connect(padF.frequency); lfo.start();
    padF.connect(padG); out(padG, 0, 0.5);

    const shF = ctx.createBiquadFilter(); shF.type = 'highpass'; shF.frequency.value = 6500;
    const shG = ctx.createGain(); shG.gain.value = 0; loopNoise().connect(shF); shF.connect(shG); out(shG, 0, 0.6);

    const scF = ctx.createBiquadFilter(); scF.type = 'bandpass'; scF.Q.value = 7; scF.frequency.value = 1200;
    const scG = ctx.createGain(); scG.gain.value = 0; loopNoise().connect(scF); scF.connect(scG);
    let scP = null; if (ctx.createStereoPanner) { scP = ctx.createStereoPanner(); scG.connect(scP); out(scP, 0, 0.2); } else out(scG, 0, 0.2);

    const fiG = ctx.createGain(); fiG.gain.value = 0;
    const trem = ctx.createGain(); trem.gain.value = 0.5;
    const tl = ctx.createOscillator(); tl.frequency.value = 7; const tlg = ctx.createGain(); tlg.gain.value = 0.5; tl.connect(tlg); tlg.connect(trem.gain); tl.start();
    [NOTE.GS3, NOTE.E4].forEach((f) => { const o = ctx.createOscillator(); o.frequency.value = f; o.connect(trem); o.start(); });
    trem.connect(fiG); out(fiG, 0, 0.5);

    layers = { padF, padG, shG, scF, scG, scP, fiG };
  }
  const setT = (param, v, tc = 0.12) => param.setTargetAtTime(v, ctx.currentTime, tc);

  /* ── guion sonoro por escena (segundos de escena) ── */
  const CUES = [
    [
      [0.05, () => { S.impact(0.32); }],
      [3.65, () => S.signature(true)],
      [4.0, () => S.riser(1.0)],
      [5.0, () => { S.impact(0.55); S.whoosh(1.7, -1, 1, 0.16); }],
      [6.3, () => bell(NOTE.B4, 0, 0.05, 0, 2.2)],
    ],
    [
      [0.4, () => S.whoosh(3.6, -0.8, 0.8, 0.07)],
      [4.3, () => S.whoosh(0.8)], [4.9, () => { S.blip(1320); S.blip(1760, 0.04, 0.09); }],
      [7.1, () => S.whoosh(0.8, 0.5, -0.4)], [7.7, () => S.blip(1480)],
      [9.2, () => S.whoosh(0.8)], [9.8, () => S.blip(1660)],
      [11.0, () => S.glide(true)], [11.6, () => { S.tap(); S.blip(980, 0.04, 0.12); }], [12.3, () => { S.blip(1320); S.blip(1760, 0.04, 0.09); }],
      [13.4, () => S.glide(false)], [13.6, () => S.whoosh(0.9, -0.5, 0.5)], [14.0, () => S.shutter()], [14.3, () => S.blip(1480)],
    ],
    [
      [1.0, () => S.whoosh(1.3, 0.9, 0)],
      [2.7, () => S.blip(1320, 0.04)],
      [4.4, () => S.glide(false)],
      [4.9, () => S.tap()],
      [4.95, () => { S.signature(false); S.impact(0.28); noise({ dur: 0.9, g: 0.05, type: 'highpass', f: 5000, wet: 0.6 }); }],
      [5.8, () => S.chirp()],
      [7.3, () => S.pop()],
      ...[0, 1, 2, 3, 4].map((i) => [7.8 + (0.05 + i * 0.075) * 4, () => S.star(i)]),
      [11.0, () => S.blip(1200, 0.04)],
      [11.4, () => S.success()],
    ],
    [
      [0.5, () => { S.blip(880, 0.04); S.blip(1320, 0.03, 0.08); }],
      [1.6, () => { S.tick(0.06); S.tick(0.05); }],
      [5.2, () => { S.blip(1760, 0.06); S.blip(2350, 0.06, 0.1); S.signature(false, 0.18); }],
      [6.0, () => S.chirp()],
      [7.2, () => { S.pop(); bell(NOTE.E5, 0.15, 0.04, 0, 2); }],
      ...[0, 1, 2, 3, 4].map((i) => [7.6 + (0.05 + i * 0.075) * 3.2, () => S.star(i)]),
      [10.2, () => S.blip(1200, 0.04)],
      [10.48, () => S.success()],
    ],
    [
      ...[0, 1, 2, 3].map((i) => [1.3 + i * 1.1, () => S.node(i)]),
      [6.8, () => S.riser(2.7)],
      [9.6, () => { S.impact(0.6); S.signature(true); }],
      [9.9, () => S.whoosh(1.4, -0.3, 0.3, 0.05)],
    ],
  ];
  const TRANSITION = () => { S.whoosh(1.1, -0.7, 0.7, 0.1); S.kick(0.2); };

  function typedCount(scene, t) {
    const p = scene === 2 ? seg(t, 7.8, 11.8) : scene === 3 ? seg(t, 7.6, 10.8) : 0;
    return Math.floor(REVIEW_TEXT.length * Math.max(0, Math.min(1, (p - 0.44) / 0.32)));
  }

  function update(E) {
    if (!ctx) return;
    const shouldRun = enabled && E.started && E.playing;
    if (shouldRun && ctx.state === 'suspended') ctx.resume();
    else if (!shouldRun && ctx.state === 'running') ctx.suspend();
    if (!shouldRun) return;
    const s = E.scene, t = E.t;
    if (s !== prevScene) {
      if (prevScene !== -1 || s !== 0) TRANSITION();
      prevScene = s; prevT = -0.001; lastBeat = -1; lastHalf = -1; typed = typedCount(s, t); lastPing = -1;
    }
    if (t < prevT || t - prevT > 0.6) prevT = t - 0.001; // salto manual: no disparar todo de golpe
    for (const [ct, fn] of CUES[s]) if (ct > prevT && ct <= t) { try { fn(); } catch (e) { /* nunca romper el render */ } }

    // pulso rítmico (92 BPM) en producto, NFC, QR y el flujo final
    const beatLen = 60 / 92;
    const pulseOn = s === 1 || s === 2 || s === 3 || (s === 4 && t < 6.6);
    if (pulseOn) {
      const b = Math.floor(t / beatLen), h = Math.floor(t / (beatLen / 2));
      if (b !== lastBeat) { lastBeat = b; S.kick(b % 4 === 0 ? 0.26 : 0.17); }
      if (h !== lastHalf) { lastHalf = h; if (h % 2 === 1) S.hat(0.02); }
    }
    // pings de la conexión NFC
    if (s === 2 && t > 2.4 && t < 4.85) { const k = Math.floor((t - 2.4) / 0.42); if (k !== lastPing) { lastPing = k; S.ping(0.035 + 0.01 * (k % 3), (k % 2 ? 0.3 : -0.3)); } }
    // destellos de partículas mientras se forma el logo
    const sparkling = (s === 0 && t > 0.3 && t < 3.7) || (s === 4 && t > 6.9 && t < 9.6);
    if (sparkling && E.clock - lastSpark > 0.07) { lastSpark = E.clock; if (Math.random() < 0.7) S.sparkle(); }
    // tecleo de la reseña
    const tc = typedCount(s, t);
    if (tc > typed) { typed = tc; if (E.clock - lastTick > 0.045) { lastTick = E.clock; S.tick(); } }

    // capas continuas
    const L = layers;
    let padG = 0.05, padF = 700, sh = 0, sc = 0, fi = 0;
    if (s === 0) { padG = 0.035 + 0.04 * seg(t, 3.6, 6.4); padF = 280 + 1000 * seg(t, 0.3, 6.5); sh = 0.03 * seg(t, 0.3, 1.2) * (1 - seg(t, 3.6, 4.4)); }
    else if (s === 1) { padG = 0.055; padF = 900; }
    else if (s === 2) { padG = 0.05; padF = 1000 + 500 * seg(t, 4.9, 6); fi = 0.03 * seg(t, 2.3, 2.8) * (1 - seg(t, 4.8, 5.1)); }
    else if (s === 3) {
      padG = 0.05; padF = 1100;
      if (t > 1.6 && t < 5.2) {
        sc = 0.045 * seg(t, 1.6, 1.9);
        const f = (seg(t, 1.6, 5.2) * 2) % 1, tri = 1 - Math.abs(2 * f - 1);
        L.scF.frequency.setTargetAtTime(900 + tri * 1900, ctx.currentTime, 0.03);
        if (L.scP) L.scP.pan.setTargetAtTime(tri * 0.8 - 0.4, ctx.currentTime, 0.05);
      }
    } else { padG = 0.06 + 0.03 * seg(t, 9.4, 10.5); padF = 900 + 1600 * seg(t, 6.8, 10); sh = 0.025 * seg(t, 6.9, 7.6) * (1 - seg(t, 9.6, 10.4)); }
    setT(L.padG.gain, padG, 0.4); setT(L.padF.frequency, padF, 0.4);
    setT(L.shG.gain, sh, 0.2); setT(L.scG.gain, sc, 0.08); setT(L.fiG.gain, fi, 0.15);
    prevT = t;
  }

  return {
    get enabled() { return enabled; },
    unlock() { if (!ctx && !init()) return; if (enabled && ctx.state === 'suspended' && engine.playing) ctx.resume(); },
    toggle() {
      enabled = !enabled;
